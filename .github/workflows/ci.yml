name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      # Audit the extras the runtime image actually installs (see Dockerfile:
      # kalshi, ibkr, web). --all-extras would drag torch/triton/cuda and
      # transformers into the audited set — the most CVE-active packages on
      # PyPI, none of which ship in the image.
      - name: Export locked Python dependencies
        run: >
          uv export --frozen --extra kalshi --extra ibkr --extra web
          --no-hashes --output-file requirements-audit.txt

      - name: Generate Python dependency audit
        shell: bash
        run: |
          uvx pip-audit==2.10.1 -r requirements-audit.txt \
            --format=json --output=python-audit.json || true
          test -s python-audit.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate web dependency audit
        working-directory: web
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          test -s npm-audit.json

      # Scanner exit code 1 means findings exist, so generation above captures
      # JSON and this deterministic policy step owns the blocking verdict.
      # Exceptions require an advisory ID, owner, reason, and future expiry.
      - name: Enforce dependency audit policy
        run: >
          python scripts/check_dependency_audit.py
          --policy .github/dependency-audit-policy.json
          --pip-report python-audit.json
          --npm-report web/npm-audit.json
          --npm-min-severity high

  safety-tests:
    name: Safety gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Install the EXACT locked dependency set (uv.lock is committed) so CI
      # tests the same runtime the bot runs. --frozen fails if the lock drifts
      # from pyproject, which is the signal we want.
      # --extra agent installs the Hermes-bridge dep (fastmcp) so the
      # agentmcp bridge test runs for real here instead of importorskip-ing.
      # --extra ibkr installs ib_async: directed_orders imports it lazily
      # inside _send, and the TIF-validation tests (c862060) reach that
      # import even with a mocked IB — without the extra every such test
      # fails with "No module named 'ib_async'" (2026-08-04, first seen
      # when the 82-commit push met CI).
      - name: Install from locked dependencies
        run: uv sync --frozen --extra dev --extra agent --extra ibkr

      # Safety gates first, fail-fast, so a triple-gate/settings regression is
      # the headline even if something else also breaks.
      - name: Run triple-gate and settings tests
        run: uv run pytest tests/test_triple_gate.py tests/test_settings.py -v

      # Then the FULL suite — CI previously ran only the two files above, so
      # every other regression guard (risk checks, execution gateway, exchange
      # adapters, strategy logic) was invisible to CI and could land on main.
      - name: Run full test suite with coverage ratchet
        # Floor lives in pyproject [tool.coverage.report] fail_under — set
        # from a fresh measure on main (65.86% on 2026-08-05), minus drift
        # headroom. Raise it only after re-measuring, never speculatively.
        run: uv run pytest -q --cov=auramaur --cov-report=term

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Blocking: the backlog was cleared (214 -> 0) and the tree is ruff-clean, so
    # lint is now a required gate — a new violation fails the PR instead of just
    # being surfaced.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        # Pinned: an unpinned install broke every PR when ruff 0.16.0 shipped
        # new default rules (1,278 violations appeared overnight, none from
        # the PRs being gated). Upgrade deliberately: bump the pin and clear
        # the new findings in one dedicated chore PR.
        run: pip install "ruff==0.15.22"

      - name: Run ruff
        run: ruff check .

  web:
    name: Web dashboard checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run lint
