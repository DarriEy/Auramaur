version: 2
updates:
  # This repo's source of truth is uv.lock. The 'pip' ecosystem edits
  # pyproject.toml WITHOUT regenerating the lock, and CI installs with
  # `uv sync --frozen` (which fails on exactly that drift) — every such PR
  # would open un-mergeable.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # Runtime deps move the live trading process: keep them in their own PR
      # so a venue-transport bump (aiohttp, pydantic, aiosqlite) is reviewed
      # and soaked on its own rather than buried in a dev-tooling batch.
      runtime-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
    ignore:
      # Pinned deliberately: an unpinned ruff auto-upgraded to 0.16.0 and
      # broke lint on every open PR. pyproject's <0.16 ceiling must not be
      # the only thing holding that line.
      - dependency-name: ruff

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]
    ignore:
      # 2026-08-04: the group bumped typescript to 7.x while
      # typescript-eslint@8 refuses TS 7 as a peer — every grouped PR
      # opened un-installable (npm ERESOLVE, #393). Hold typescript majors
      # until the eslint toolchain declares TS 7 support, then remove.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
